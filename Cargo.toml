[package]
name = "wireguard-tui"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
autoexamples = false
description = "A secure, responsive terminal manager for WireGuard connections"
license = "MIT"
readme = "README.md"
repository = "https://github.com/beamiter/wireguard-tui"
homepage = "https://github.com/beamiter/wireguard-tui"
keywords = ["wireguard", "vpn", "tui", "linux", "networking"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
]

[dependencies]
anyhow = "1"
crossterm = "0.28"
directories = "5"
libc = "0.2"
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
