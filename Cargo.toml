[package]
name = "wireguard-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.28", features = ["all-widgets"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
directories = "5"
crossterm = "0.28"
toml = "0.8"
regex = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"
